# Crypto source matrix (agent-collectable)
# Generated: 2026-11-06. Endpoint details verified against official docs on that date.
# Market data from an exchange is a primary source for that exchange only; cross-exchange claims need a second venue or an aggregator.

meta:
  name: "Crypto trading source matrix"
  version: 1
  domain: crypto
  generated_at: "2026-11-06"
  scope: "Exchange APIs, derivatives metrics, on-chain data, archives, SDKs"
  authority_legend:
    A: "一手事实：交易所官方文档 / 规范 / 官方归档"
    B: "权威解释：机构级数据商、官方研究"
    C: "可靠二手：开源聚合器 / 社区项目（需交叉验证）"
    D: "线索：博客、媒体、未审来源（不可当结论）"
  evidence_legend:
    spec: "交易所接口规范"
    official-doc: "官方文档"
    vendor-doc: "商业数据商文档"
    dataset: "官方归档 / 结构化数据"
    community: "社区 / 开源项目"
    index: "索引 / 目录"
    preprint: "预印本"
  category_legend:
    exchange: "交易所官方 API"
    aggregator: "跨所聚合与币种数据"
    derivatives: "衍生品指标（资金费率 / OI / 强平）"
    onchain: "链上数据与地址标签"
    archive: "历史归档（tick / 订单簿）"
    sdk: "客户端库"
    research: "研究"
  pit_legend:
    yes: "提供 Point-in-Time / as-reported 版本"
    partial: "部分字段或部分数据集提供 PIT（新闻：首发时间可得，但历史重建不保证）"
    no: "只给最新修订值，回测需自行处理未来函数"
    not_applicable: "数据不可修订（行情/逐笔/订单簿/链上/归档）或条目本身是工具，PIT 不适用"
    unverified: "尚未核实，不能假设有或没有 PIT"
  # 探测后的人工核验层（PIT 修正、verification、data_types）在 data/enrichment.yaml，由 build-data.cjs 合并。
  content_access_legend:
    static: "静态 HTML，可直接取正文"
    portal: "落地页/目录页，需跟到正文"
    js: "需要浏览器渲染（纯 fetch 拿不到正文）"
    challenge: "反爬 / 人机校验 / 鉴权墙，需浏览器或人工确认"
    api: "JSON / XML 结构化返回"
    binary: "PDF / 二进制"
  free_tier_note: "免费额度与限流必须在核实日期上写；没核实写 unverified。"

