# Quant source matrix (agent-collectable)
# Generated: 2026-11-06. HTTP status is a same-day snapshot; re-probe before trusting it.
# breadth = stable primary data / standards; depth = fast-moving APIs and docs.

meta:
  name: "Quantitative trading source matrix"
  version: 1
  domain: quant
  generated_at: "2026-11-06"
  scope: "Equities/ETF, macro, fundamentals, China A-share/HK, execution APIs"
  authority_legend:
    A: "一手事实：监管原始文件、官方统计、交易所/官方 API"
    B: "权威解释：持牌数据商、学术机构、同行评审"
    C: "可靠二手：开源聚合器 / 社区维护项目（需交叉验证）"
    D: "线索：博客、媒体、未审来源（不可当结论）"
  evidence_legend:
    official-doc: "官方文档 / 监管机构页面"
    dataset: "结构化数据文件 / 数据集"
    vendor-doc: "商业数据商文档"
    spec: "接口规范"
    peer-reviewed: "同行评审论文"
    preprint: "预印本（未审）"
    index: "索引 / 目录"
    community: "社区 / 开源项目"
    blog: "官方博客"
  category_legend:
    filing: "监管申报与公司披露"
    macro: "宏观经济与统计"
    market-data: "行情与交易数据"
    fundamentals: "财务基本面（含 PIT）"
    china: "中国市场与中国官方数据"
    execution: "券商 / 交易所执行接口"
    research: "研究论文与工作论文"
    news: "新闻与另类文本"
  pit_legend:
    yes: "提供 Point-in-Time / as-reported 版本"
    partial: "部分字段或部分数据集提供 PIT"
    no: "只给最新修订值，回测需自行处理未来函数"
    not_applicable: "数据不可修订（原始行情/逐笔/链上/归档）或条目本身是工具，PIT 不适用"
    unverified: "尚未核实，不能假设有或没有 PIT"
  # 探测后的人工核验层（PIT 修正、verification、data_types）在 data/enrichment.yaml，由 build-data.cjs 合并。
  content_access_legend:
    static: "静态 HTML，可直接取正文"
    portal: "落地页/目录页，需跟到正文"
    js: "需要浏览器渲染（纯 fetch 拿不到正文）"
    challenge: "反爬 / 人机校验 / 鉴权墙，需浏览器或人工确认"
    api: "JSON / XML 结构化返回"
    binary: "PDF / 二进制"
  free_tier_note: "free_tier 只在核实过的日期上写；没核实就写 unverified，不许凭印象写数字。"

