  ibkr-api: not_applicable
  alpaca-trading: not_applicable
  nber: not_applicable
  ssrn: not_applicable
  arxiv-qfin: not_applicable
  akshare: not_applicable
  # crypto: exchanges, aggregators, derivatives, on-chain, archives, sdk, research
  binance-spot-api: not_applicable
  binance-futures-api: not_applicable
  binance-agent-native: not_applicable
  binance-llms-txt: not_applicable
  binance-mcp: not_applicable
