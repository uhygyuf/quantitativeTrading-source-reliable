# Enrichment layer for quantitativeTrading-source-reliable.
# The matrices record what the 2026-11-06 probe saw. This file records what was
# verified afterwards, and adds dataset-level tags and PIT corrections.
# tools/build-data.cjs merges this on top of the matrices and rejects unknown ids.
meta:
  version: 1
  applied_at: "2026-11-06"

# pit states:
#   yes            as-of / as-reported vintages available
#   partial        some fields or datasets are PIT
#   no             latest revision only; backtests must model look-ahead
#   not_applicable the data cannot be revised (raw ticks/quotes/order books,
#                  on-chain state, archives) or the entry is tooling/sandbox
#   unverified     nobody checked; do not assume either way
pit:
  world-bank-data: unverified
  oecd-data: unverified
  # quant market data / execution / research / tooling
  massive: not_applicable
  alpaca-data: not_applicable
  databento: not_applicable
  tiingo: not_applicable
  alpha-vantage: not_applicable
  finnhub: not_applicable
  twelve-data: not_applicable
