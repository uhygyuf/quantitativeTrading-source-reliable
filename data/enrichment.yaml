  python-binance: not_applicable
  binance-market-data-api: not_applicable
  binance-data-api-vision: not_applicable
  binance-research: not_applicable
  # news keeps a revision dimension: first-published time vs page update time
  gdelt: partial
  benzinga-api: partial
  ravenpack: partial
  coindesk: partial
  cointelegraph: partial
  decrypt: partial
  theblock: partial

# verification states:
#   discovered         recorded but not reachable from this network
#                      (HTTP 403/429/202/challenge, or unreachable)
#   reachable          HTTP 200 only; the payload was not inspected
#   schema_verified    a payload was fetched and the documented shape was seen
#   semantic_verified  a concrete numeric/semantic claim was checked
#                      (fee, rate limit, endpoint path, PIT, rename)
#   production_approved used end-to-end in a real task
verification:
  binance-market-data-api: production_approved
  coindesk: production_approved
  binance-data-api-vision: schema_verified
  coingecko-api: schema_verified
  decrypt: schema_verified
  theblock: schema_verified
  binance-spot-api: semantic_verified
  binance-futures-api: semantic_verified
  binance-ws-futures: semantic_verified
  binance-mcp: semantic_verified
  alpha-vantage: semantic_verified
  alpaca-data: semantic_verified
  twelve-data: semantic_verified
  massive: semantic_verified
  sharadar: semantic_verified
  fred: semantic_verified
  alfred: semantic_verified
  fmp: semantic_verified
  financial-datasets: semantic_verified
  equibles: semantic_verified

