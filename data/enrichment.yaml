  coinglass-api: not_applicable
  kaiko: not_applicable
  coinmetrics: not_applicable
  glassnode: not_applicable
  nansen: not_applicable
  cryptoquant: not_applicable
  etherscan-api: not_applicable
  dune-docs: not_applicable
  defillama-api: not_applicable
  blockchair-api: not_applicable
